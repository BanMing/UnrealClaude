; Plugin-shipped defaults for UnrealClaudeSettings (UCLASS Config=Editor, DefaultConfig).
;
; bAutoApproveScripts=True flips the in-code default (false) for this fork so MCP-driven /
; autonomous agent workflows are not blocked by the per-script permission dialog. Every
; auto-approval is still logged (LogUnrealClaude). To restore the human-in-the-loop dialog,
; set bAutoApproveScripts=False here or in Project Settings -> Plugins -> Unreal Claude.

[/Script/UnrealClaude.UnrealClaudeSettings]
bAutoApproveScripts=True
